<!DOCTYPE html>
<html lang="en">
<head>
<title>Command The Layout</title>

<style>
button {
padding: 10px
border: 1px solid #ccc;
background-color: #fff;
}

.container {
display: grid;
}

.horizontal {
grid-template-columns: repeat(4, 600px);
}

.vertical {
grid-template-columns: 600px;
}

.box {
width: 600px;
}

.box-1 { background-color: #3498db; }
.box-2 { background-color: #e74c3c; }
.box-3 { background-color: #2ecc71; }
.box-4 { background-color: #f1c40f; }

</style>
</head>

<body>
<div class="controls">
 <button onclick="document.getElementById('layout-container').className = 'container horizontal'">
 Horizontal
</button>
<button onclick="document.getElementById('layout-container').className = 'container vertical'">
Vertical
</button>

</div>
<div id="layout-container" class="container horizontal">
<div class="box box-1">Box 1</div>
<div class="box box-2">Box 2</div>
<div class="box box-3">Box 3</div>
<div class="box box-4">Box 4</div>
</div>

</body>
</html>
